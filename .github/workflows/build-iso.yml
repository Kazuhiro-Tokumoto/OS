# ============================================================================
# myOS のインストール ISO を GitHub のマシンで作って、リリースに添付する。
#
# 手で走らせる:
#   Actions タブ -> "Build install ISO" -> Run workflow
# タグを押したときにも走る:
#   git tag v1.0 && git push origin v1.0
#
# 出来上がるもの:
#   - ワークフローの成果物 (Artifacts)      … 90 日で消える。確認用
#   - リリースへの添付                      … こちらが本番
#
# 時間の目安: カーネル 60〜90 分 + それ以外 20 分。
# 2 回目からは bzImage をキャッシュから取るので 20 分ほどで終わる。
# ============================================================================
name: Build install ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版 (タグは v を付けたものになる)"
        required: true
        default: "1.0"
      release:
        description: "リリースに添付する"
        type: boolean
        default: true
      cmdline:
        description: "カーネルのコマンドライン (空なら既定)。障害の切り分け用"
        required: false
        default: ""
      suffix:
        description: "ISO 名に付ける印 (例 debug)。リリースには添付しない用"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write          # リリースの作成と添付に要る

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      KVER: "6.12.9"
      # 大きいものは / ではなく /mnt に置く。
      # GitHub のランナーは / の空きが 20GB ほどしかないが、
      # /mnt には 60GB 以上ある。カーネルの木だけで数 GB 使う。
      ROOTFS: /mnt/myos/rootfs
      KDIR: /mnt/myos/kernelbuild

    steps:
      - uses: actions/checkout@v4

      - name: 版を決める
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          sfx="${{ inputs.suffix }}"
          [ -n "$sfx" ] && sfx="-$sfx"
          echo "version=$v"   >> "$GITHUB_OUTPUT"
          echo "tag=v$v"      >> "$GITHUB_OUTPUT"
          echo "iso=myos-install-$v$sfx.iso" >> "$GITHUB_OUTPUT"

      - name: 空きを確認して置き場を作る
        run: |
          df -h / /mnt
          # /mnt の下は root で作る。build/ は *root で作らない*。
          # sudo mkdir で作ると root 所有になり、あとで一般ユーザーとして
          # 走る手順 (make java-demo、キャッシュの復元、成果物の収集) が
          # そこに書けなくなる。実際それで 2 回落とした。
          # root は他人のディレクトリにも書けるので、こちらを緩くしておけば
          # 両方通る。
          sudo mkdir -p "$ROOTFS" "$KDIR"
          mkdir -p build

      - name: ビルドに要るものを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap nasm xorriso squashfs-tools busybox-static \
            build-essential bc bison flex libelf-dev libssl-dev \
            cpio zstd curl python3
          # busybox は initramfs にそのまま入れるので静的リンクのものが要る
          ldd "$(command -v busybox)" >/dev/null 2>&1 \
            && { echo "busybox が動的リンクです"; exit 1; } || true

      # カーネルは一番重い。中身が変わらない限り作り直さない。
      # 鍵はビルドスクリプトの中身と版。設定を変えれば自然に作り直される。
      - name: カーネルのキャッシュ
        id: kcache
        uses: actions/cache@v4
        with:
          path: build/bzImage
          key: bzImage-${{ env.KVER }}-${{ hashFiles('tools/build_kernel.sh') }}

      - name: カーネルをビルド
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          sudo -E sh tools/build_kernel.sh "$KDIR" "$KVER"
          sudo cp "$KDIR/linux-$KVER/arch/x86/boot/bzImage" build/bzImage
          sudo chown "$USER" build/bzImage
          # 木は 3GB ほどある。ISO には要らないので消して空きを戻す。
          sudo rm -rf "$KDIR"
          ls -l build/bzImage

      # 次の版で上げる桁を出しておく。
      # x.y.z の決めは docs/release-1.0.md の「版の付け方」。
      #   y … カーネルを作り直したとき
      #   z … カーネルがそのままのとき
      # 「作り直したか」はキャッシュが当たったかどうかそのもので、
      # 判断の余地が無い。毎回ここに出しておけば迷わない。
      - name: 次に上げる桁
        run: |
          if [ "${{ steps.kcache.outputs.cache-hit }}" = "true" ]; then
            echo "カーネル: キャッシュから (作り直していない)"
            echo "  -> 次のリリースは z を上げる (例 1.5.0 -> 1.5.1)"
          else
            echo "カーネル: 作り直した"
            echo "  -> 次のリリースは y を上げて z は 0 に戻す (例 1.5.3 -> 1.6.0)"
          fi

      # デスクトップに置く Java のデモ。
      # build_rootfs.sh はこれが無ければ黙って飛ばすので、先に作っておく。
      # 失敗しても続ける。デモの jar 1 個のために ISO を諦める理由が無い。
      # 無ければ build_rootfs.sh が「スキップ」と言って先へ進む。
      #
      # timeout-minutes が要る。continue-on-error は「失敗」は拾うが
      # 「終わらない」は拾わない。実際 apt がここで 24 分止まった
      # (ロック待ちか debconf のプロンプト待ち)。時間で切らないと、
      # ジョブの上限 350 分までぶら下がったままになる。
      - name: Java のデモアプリ
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # ロックは待たずに諦める。待つと止まったように見える。
          sudo apt-get install -y --no-install-recommends \
            -o DPkg::Lock::Timeout=60 default-jdk-headless
          make java-demo
          ls -l build/hello.jar

      - name: ルートファイルシステムをビルド
        # MYOS_VERSION は /etc/myos/version.conf に刻まれる。
        # myos-update がこれと GitHub のリリースを見比べる。
        env:
          MYOS_VERSION: ${{ steps.ver.outputs.version }}
        run: sudo -E sh tools/build_rootfs.sh "$ROOTFS"

      # ルートを固める前にやること。GPU のファームウェアをここから拾う。
      - name: インストーラの initramfs
        run: |
          sudo -E sh tools/make_install_initramfs.sh \
            build/install-initramfs.cpio.gz "$ROOTFS"
          ls -l build/install-initramfs.cpio.gz

      # ルートを掃除し終わった *あと* に固めること。
      # 先に固めると gcc やヘッダが入ったままの大きいものが出来る。
      - name: ルートを固める
        run: |
          sudo rm -f build/myos.squashfs
          sudo mksquashfs "$ROOTFS" build/myos.squashfs \
            -comp zstd -Xcompression-level 19 -b 1M -noappend -quiet
          sudo rm -rf "$ROOTFS"
          ls -l build/myos.squashfs

      - name: ISO にまとめる
        run: |
          # コマンドラインを指定されたときだけ差し替える。
          # 「カーネルに入ったあと画面が真っ黒」のような、
          # 中が見えない障害を追うために要る。
          extra=""
          if [ -n "${{ inputs.cmdline }}" ]; then
            extra='--cmdline'
            echo "cmdline を差し替え: ${{ inputs.cmdline }}"
          fi
          sudo python3 tools/build_iso.py \
            --kernel  build/bzImage \
            --initrd  build/install-initramfs.cpio.gz \
            --payload build/myos.squashfs \
            ${extra:+"$extra" "${{ inputs.cmdline }}"} \
            --out     "build/${{ steps.ver.outputs.iso }}"
          # build/ の中は sudo で作ったので root 所有になっている。
          # このあと一般ユーザーで書き込む (sha256 の保存、成果物の収集) ので、
          # ディレクトリごと渡しておく。
          # 1 ファイルだけ chown していたら、隣に .sha256 を作る段で
          # Permission denied になった。
          sudo chown -R "$USER" build
          cd build && sha256sum "${{ steps.ver.outputs.iso }}" \
            > "${{ steps.ver.outputs.iso }}.sha256"
          cat "build/${{ steps.ver.outputs.iso }}.sha256" 2>/dev/null || \
            cat "${{ steps.ver.outputs.iso }}.sha256"

      # リリースが作れなかったときの逃げ道。ここからでも落とせる。
      - name: 成果物として残す
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.iso }}
          path: |
            build/${{ steps.ver.outputs.iso }}
            build/${{ steps.ver.outputs.iso }}.sha256
          retention-days: 90
          compression-level: 0     # ISO は縮まない。時間の無駄

      # カーネル単体も置く。インストール済みの機械はこれを取ってきて
      # 入れ替える (ISO を焼き直して入れ直す必要が無い)。
      # 21MB。sha256 を並べて置いて、落とした側が突き合わせられるように
      # しておく。中身が壊れたまま生領域へ書くと起動しなくなる。
      - name: カーネルを単体でも置く
        run: |
          cp build/bzImage "build/myos-kernel-${{ steps.ver.outputs.version }}.bzImage"
          cd build && sha256sum "myos-kernel-${{ steps.ver.outputs.version }}.bzImage" \
              > "myos-kernel-${{ steps.ver.outputs.version }}.bzImage.sha256"
          cat "myos-kernel-${{ steps.ver.outputs.version }}.bzImage.sha256"

      - name: リリースに添付
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          ISO: ${{ steps.ver.outputs.iso }}
        run: |
          # 本文は毎回組み立て直す。実際に焼いたものの sha256 を末尾に足す。
          # 文書に固定で書いておくと、ビルドし直したときに古い値が残る。
          # 本文の中の版番号を、いま焼いている版に合わせる。
          # 文書は 1.0 のときのまま置いてあるので、そのまま使うと
          # v1.1 のリリースに「myOS 1.0」と書かれることになる。
          V='${{ steps.ver.outputs.version }}'
          sed -e "s/^# myOS 1\.0/# myOS $V/" \
              -e "s/myos-install-1\.0\.iso/myos-install-$V.iso/g" \
              docs/release-1.0.md > /tmp/notes.md
          {
            echo
            echo "---"
            echo
            echo "この版の \`$ISO\` の sha256:"
            echo
            echo '```'
            cat "build/$ISO.sha256"
            echo '```'
          } >> /tmp/notes.md

          # 既にあれば作り直さず、本文だけ更新する。
          # 同じタグで何度も走らせられるように。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" \
              --title "myOS ${{ steps.ver.outputs.version }}" \
              --notes-file /tmp/notes.md \
              --target "$GITHUB_SHA"
          fi
          K="myos-kernel-${{ steps.ver.outputs.version }}.bzImage"
          gh release upload "$TAG" \
            "build/$ISO" "build/$ISO.sha256" \
            "build/$K" "build/$K.sha256" --clobber
          gh release view "$TAG" --json url --jq .url
